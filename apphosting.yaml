# Firebase App Hosting config — runs the TanStack Start SSR server on Cloud Run.
# Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 10
  minInstances: 0
  concurrency: 80

env:
  # Set the real value in the Firebase console (App Hosting → Secrets)
  # or with: firebase apphosting:secrets:set GROQ_API_KEY
  - variable: GROQ_API_KEY
    secret: GROQ_API_KEY
    availability:
      - RUNTIME
