# Firebase App Hosting config — runs the TanStack Start SSR frontend on Cloud Run.
# The backend is the Flask service in ./backend (deployed separately to Cloud Run).
# Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 10
  minInstances: 0
  concurrency: 80

env:
  # URL of the deployed Flask backend, e.g.
  #   https://dynamic-agent-api-abc123-uc.a.run.app
  # Set with: firebase apphosting:backends:update ... or edit this value.
  - variable: CHAT_BACKEND_URL
    value: "http://127.0.0.1:5001"
    availability:
      - RUNTIME
